    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 28px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; font-size: 14px; line-height: 1.7; word-break: keep-all; -webkit-font-smoothing: antialiased; }

    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 5px; }
    ::selection { background: var(--accent); color: var(--paper); }
    .wrap { width: min(1000px, calc(100% - 96px)); margin-inline: auto; }

    .skip:focus { top: 12px; }
    [aria-disabled="true"] { color: var(--muted); }

    .document-nav { display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: 12px; color: var(--accent); }

    .profile-identity { display: flex; align-items: flex-start; gap: 24px; }
    .profile-details { min-width: 0; }
    h1 { font-size: 28px; font-weight: 650; letter-spacing: -.055em; line-height: 1.35; margin: 0 0 10px; overflow-wrap: anywhere; }
    .profile-school, .profile-major { color: var(--muted); font-size: 13px; margin: 0; }
    .school-logo { display: block; width: 132px; max-width: 100%; height: auto; margin: 6px 0; }
    .profile-contacts { display: grid; gap: 8px; margin-top: 22px; font-size: 13px; }
    .profile-contacts p { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; margin: 0; }
    .contact-label { color: var(--muted); font-size: 11px; }

    .portrait-media img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: contain; object-position: center; }
    .portrait-media img[hidden] { display: none; }
    h2 { font-size: 25px; font-weight: 650; letter-spacing: -.05em; line-height: 1.4; margin: 0; }
    .about-title { max-width: 580px; margin-bottom: 22px; text-wrap: balance; }
    .about-copy { margin: 0; color: var(--accent); font-size: 14px; line-height: 1.7; white-space: pre-line; }
    .section { padding: 36px 0 48px; border-top: 1px solid var(--line); }
    .section-head { margin-bottom: 32px; }
    .stack { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 28px; }
    .stack-row { min-width: 0; }
    .stack-row h3 { color: var(--muted); font-size: 11px; font-weight: 500; margin: 0 0 14px; letter-spacing: 0; }
    .tags { display: flex; flex-wrap: wrap; gap: 5px 0; }
    .tag { color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
    .tag + .tag::before { content: "/"; margin: 0 10px; color: var(--muted); }
    .tag.placeholder { color: var(--muted); }
    .stack .tags { display: grid; gap: 9px; }
    .stack .tag { display: flex; align-items: center; gap: 9px; font-size: 13px; }
    .stack .tag + .tag::before { content: none; }
    .skill-icon { display: inline-flex; flex-shrink: 0; width: 18px; height: 18px; }
    .skill-icon svg { width: 100%; height: 100%; }
    .projects { display: grid; }
    .project { display: grid; grid-template-columns: minmax(0, 1fr) 360px; grid-template-areas: "body art" "link art"; gap: 18px 48px; align-items: start; padding: 32px 0; }
    .project:first-child { padding-top: 0; }
    .project + .project { border-top: 1px solid var(--line); }
    .project:last-child { padding-bottom: 0; }
    .project.project-text-only { grid-template-columns: minmax(0, 1fr); grid-template-areas: "body" "link"; }
    .project-text-only .project-body { max-width: 720px; }
    .project-body { grid-area: body; }
    .entry-label { display: block; margin-bottom: 12px; color: var(--muted); }
    h3 { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -.035em; line-height: 1.4; overflow-wrap: anywhere; }
    .project h3 { margin-bottom: 16px; }
    .project p { color: var(--accent); font-size: 14px; margin: 0 0 18px; }
    .project .publication-meta { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
    .project-link { grid-area: link; justify-self: start; color: var(--accent); font-size: 13px; }
    .github-link, .publication-link { display: inline-flex; align-items: center; gap: 7px; }
    .github-icon, .dbpia-icon { display: inline-flex; flex-shrink: 0; width: 16px; height: 16px; }
    .dbpia-icon { object-fit: contain; }
    .github-icon svg { display: block; width: 100%; height: 100%; }
    .project-art { grid-area: art; display: grid; margin: 0; color: var(--accent); }

    .footer-inner { display: flex; justify-content: flex-end; }
    .empty-note { color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .wrap { width: calc(100% - 56px); }
      .profile-layout { grid-template-columns: 300px minmax(0, 1fr); gap: 36px; }
      .project { grid-template-columns: minmax(0, 1fr) 280px; column-gap: 32px; }
      .stack { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 36px; }

      .section { padding: 28px 0 36px; }
      .section-head { margin-bottom: 26px; }
      .stack { column-gap: 20px; }
      .project { padding: 28px 0; }

    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

</head>

      try {

        return url.protocol === 'https:' && url.hostname === 'github.com' && !url.username && !url.password ? url.href : null;
      } catch { return null; }
    }
    function githubLink(value, className, label) {

      const node = element(url ? 'a' : 'span', `${className} github-link`);

    if (profile.schoolLogo) {
      const logo = element('img', 'school-logo');
      logo.alt = profile.school || '학교 로고';
      logo.decoding = 'async';
      logo.addEventListener('load', () => { document.getElementById('school').replaceChildren(logo); });
      logo.src = profile.schoolLogo;
    }
    setText('major', profile.major);
    const email = (profile.email || '').trim();
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      const link = element('a', '', email);
      link.href = 'mailto:' + encodeURIComponent(email).replace('%40', '@');
      document.getElementById('contact-email').replaceChildren(link);
      document.getElementById('contact-email').removeAttribute('aria-disabled');
    }
    try {
      const blog = new URL(profile.blog);
      if (['https:', 'http:'].includes(blog.protocol) && !blog.username && !blog.password) {
        const link = element('a', '', '블로그 방문하기 ↗');
        link.href = blog.href;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', '블로그 방문하기 (새 탭)');
        document.getElementById('contact-blog').replaceChildren(link);
        document.getElementById('contact-blog').removeAttribute('aria-disabled');
      }
    } catch { /* 주소가 없거나 올바르지 않으면 입력 예정 문구를 유지합니다. */ }
    document.querySelectorAll('[data-github]').forEach(node => {
      node.replaceWith(githubLink(profile.github, node.className, 'GitHub 방문하기 ↗'));
    });
    if (profile.photo) {
      const photo = document.getElementById('profile-photo');
      photo.alt = profile.name ? `${profile.name}의 프로필 사진` : '프로필 사진';
      photo.addEventListener('load', () => {
        photo.hidden = false;
        document.getElementById('photo-placeholder').style.visibility = 'hidden';
        setText('photo-caption', profile.name || '프로필 사진');
      });
      photo.addEventListener('error', () => { photo.hidden = true; setText('photo-caption', '사진을 불러올 수 없습니다'); });
      photo.src = profile.photo;
    }
    const skills = profile.skills.length ? profile.skills : [
      { category: 'Languages', items: ['사용하는 프로그래밍 언어'] },
      { category: 'Frameworks & Libraries', items: ['사용하는 프레임워크와 라이브러리'] },
      { category: 'Tools & Platforms', items: ['개발 도구와 플랫폼'] }
    ];
    // HTML에 포함한 SVG 아이콘으로 외부 서비스 없이 기술 배지를 표시합니다.
    const skillIcons = {
      'ROS 2': '<svg viewBox="0 0 32 32" fill="#22314e"><circle cx="7" cy="7" r="3"/><circle cx="16" cy="7" r="3"/><circle cx="25" cy="7" r="3"/><circle cx="7" cy="16" r="3"/><circle cx="16" cy="16" r="3"/><circle cx="25" cy="16" r="3"/><circle cx="7" cy="25" r="3"/><circle cx="16" cy="25" r="3"/><circle cx="25" cy="25" r="3"/></svg>',
      'C/C++': '<svg viewBox="0 0 32 32" fill="none"><path d="M16 1 29 8.5v15L16 31 3 23.5v-15Z" fill="#32699a"/><path d="M18 10.7a7 7 0 1 0 0 10.6" stroke="#fff" stroke-width="3"/><path d="M22 13v6m-3-3h6m3-3v6m-3-3h6" stroke="#fff" stroke-width="1.6"/></svg>',
      'Python': '<svg viewBox="0 0 32 32"><path d="M16 2c-7 0-7 2-7 6v3h8v2H6c-5 0-5 13 0 13h3v-5c0-3 2-5 5-5h8c3 0 4-2 4-5V8c0-4-3-6-10-6Z" fill="#3776ab"/><path d="M16 30c7 0 7-2 7-6v-3h-8v-2h11c5 0 5-13 0-13h-3v5c0 3-2 5-5 5h-8c-3 0-4 2-4 5v3c0 4 3 6 10 6Z" fill="#ffd343"/><circle cx="12" cy="7" r="1.3" fill="#fff"/><circle cx="20" cy="25" r="1.3" fill="#fff"/></svg>',
      'Linux': '<svg viewBox="0 0 32 32"><path d="M9 12C9 1 23 1 23 12l3 10c2 7-22 7-20 0Z" fill="#292d32"/><ellipse cx="16" cy="21" rx="7" ry="8" fill="#fafafa"/><ellipse cx="13" cy="10" rx="2.4" ry="3.2" fill="#fff"/><ellipse cx="19" cy="10" rx="2.4" ry="3.2" fill="#fff"/><circle cx="13.5" cy="10.5" r="1" fill="#292d32"/><circle cx="18.5" cy="10.5" r="1" fill="#292d32"/><path d="m12 14 4-3 4 3-4 3Z" fill="#edb536"/><path d="m4 26 7-2 3 5-9 1Zm24 0-7-2-3 5 9 1Z" fill="#edb536"/></svg>',
      'eBPF': '<svg viewBox="0 0 32 32" fill="none"><rect x="8" y="8" width="16" height="16" rx="3" fill="#b87919"/><path d="M12 3v5m8-5v5m-8 16v5m8-5v5M3 12h5m-5 8h5m16-8h5m-5 8h5" stroke="#b87919" stroke-width="2"/><path d="m15 11-3 6h5l-2 5 6-8h-5l2-3" fill="#fff"/></svg>',
      'GNU Binutils': '<svg viewBox="0 0 32 32" fill="none"><path d="M19 4a8 8 0 0 0-8 10L3 22a4 4 0 0 0 6 6l8-8A8 8 0 0 0 27 9l-6 6-5-5 6-6Z" fill="#79528a"/><circle cx="7" cy="25" r="1.5" fill="#fff"/></svg>',
      'QEMU': '<svg viewBox="0 0 32 32" fill="none"><rect x="3" y="4" width="26" height="20" rx="3" fill="#d77b29"/><path d="M12 28h8m-4-4v4M9 10l4 4-4 4m7 0h7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 28h8m-4-4v4" stroke="#d77b29" stroke-width="2"/></svg>',
      'CMake': '<svg viewBox="0 0 32 32"><path d="M16 2 2 29l12-9Z" fill="#387bb2"/><path d="m16 2 2 18 12 9Z" fill="#c64747"/><path d="m14 22-12 7h28l-12-7Z" fill="#4b9859"/></svg>',
      'Raspberry Pi 5': '<svg viewBox="0 0 32 32" fill="none"><rect x="3" y="5" width="26" height="22" rx="3" fill="#467b48"/><rect x="10" y="10" width="11" height="11" rx="1" fill="#293b33"/><path d="M7 8h18" stroke="#d8c57c" stroke-width="2" stroke-dasharray="1 2"/><path d="M25 13h6v5h-6Zm0 7h6v5h-6Z" fill="#c5ceca"/><rect x="8" y="25" width="8" height="5" rx="1" fill="#c5ceca"/><circle cx="6" cy="23" r="1" fill="#d8c57c"/></svg>',
      'STM32': '<svg viewBox="0 0 32 32" fill="none"><rect x="8" y="8" width="16" height="16" rx="2" fill="#28729b"/><path d="M11 3v5m5-5v5m5-5v5M11 24v5m5-5v5m5-5v5M3 11h5m-5 5h5m-5 5h5m16-10h5m-5 5h5m-5 5h5" stroke="#28729b" stroke-width="2"/><path d="m11 16 3 3 7-7" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    };
    skills.forEach(group => {
      const row = element('div', 'stack-row');
      const tags = element('div', 'tags');
      group.items.forEach(item => {
        const tag = element('span', profile.skills.length ? 'tag' : 'tag placeholder');
        if (Object.hasOwn(skillIcons, item)) {
          const icon = element('span', 'skill-icon');
          icon.setAttribute('aria-hidden', 'true');
          icon.innerHTML = skillIcons[item];
          tag.append(icon);
        }
        tag.append(element('span', '', item));
        tags.append(tag);
      });
      row.append(element('h3', '', group.category), tags);
      document.getElementById('skill-list').append(row);
    });
    const projects = profile.projects.length ? profile.projects : [
      { name: '첫 번째 프로젝트', description: '프로젝트가 해결하려는 문제, 주요 기능, 내가 맡은 역할을 간단히 소개해주세요.', stack: ['사용 기술'], github: '' },
      { name: '두 번째 프로젝트', description: '직접 만들며 배운 점이나 구현 과정에서 기억에 남는 경험을 소개해주세요.', stack: ['사용 기술'], github: '' }
    ];
    function projectArt(item, kind) {
      if (!item.screenshot) return null;
      const art = element('figure', 'project-art');
      const media = element('div', 'project-art-media');
      const placeholder = element('div', 'project-art-placeholder');
      placeholder.setAttribute('aria-hidden', 'true');
      // 고정된 장식만 SVG로 작성하며, 사용자 입력은 textContent로 처리합니다.
      placeholder.innerHTML = kind === 'PAPER'
        ? '<svg viewBox="0 0 80 80" fill="none"><path d="M19 8h29l13 14v50H19Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M48 8v15h13M28 34h24M28 42h24M28 50h24M28 58h15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
        : '<svg viewBox="0 0 80 80" fill="none"><rect x="8" y="14" width="64" height="52" rx="4" stroke="currentColor" stroke-width="2"/><path d="M8 26h64M29 38l-9 8 9 8m22-16 9 8-9 8m-8-19-6 22" stroke="currentColor" stroke-width="2"/><circle cx="15" cy="20" r="1.5" fill="currentColor"/><circle cx="21" cy="20" r="1.5" fill="currentColor"/></svg>';
      media.append(placeholder);
      if (item.screenshot) {
        try {
          const url = new URL(item.screenshot, document.baseURI);
          if (!['https:', 'http:', 'file:'].includes(url.protocol) || url.username || url.password) throw new Error('Invalid screenshot URL');
          const title = item.name || item.title || '프로젝트';
          const link = element('a', 'project-screenshot');
          link.href = url.href;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.setAttribute('aria-label', `${title} 스크린샷 원본 보기 (새 탭)`);
          link.hidden = true;
          const image = element('img');
          image.alt = item.screenshotAlt || `${title} 스크린샷`;
          image.decoding = 'async';
          image.addEventListener('load', () => { placeholder.hidden = true; link.hidden = false; });
          image.addEventListener('error', () => { link.remove(); placeholder.hidden = false; });
          link.append(image);
          media.append(link);
          image.src = url.href;
        } catch { /* 이미지 경로가 올바르지 않으면 기본 아이콘을 유지합니다. */ }
      }
      art.append(media);
      return art;
    }
    projects.forEach(item => {
      const article = element('article', 'project');
      const art = projectArt(item, 'PROJECT');
      const body = element('div', 'project-body');
      const tags = element('div', 'tags');
      (item.stack || []).forEach(tech => tags.append(element('span', 'tag', tech)));
      tags.setAttribute('aria-label', '사용 기술');
      body.append(element('span', 'entry-label mono', item.category || 'Software'), element('h3', '', item.name), element('p', '', item.description), tags);
      const link = githubLink(item.github, 'project-link', 'GitHub ↗');
      if (link.tagName === 'A') link.setAttribute('aria-label', `${item.name} GitHub 저장소 (새 탭)`);
      article.append(body, link);
      if (art) article.append(art);
      else article.classList.add('project-text-only');
      document.getElementById('project-list').append(article);
    });
    (profile.publications || []).forEach(paper => {
      const article = element('article', 'project publication');
      const art = projectArt(paper, 'PAPER');
      const body = element('div', 'project-body');
      const title = paper.title || '논문 제목 입력 예정';
      const metadata = [paper.authors, paper.role, paper.venue, paper.year, paper.pages ? `pp. ${paper.pages}` : ''].filter(Boolean).join(' · ');
      body.append(
        element('span', 'entry-label mono', paper.category || 'Research'),
        element('h3', '', title),
        element('p', 'publication-meta', metadata || '저자 · 학회·학술지 · 발표 연도 입력 예정'),
        element('p', '', paper.description || '연구 주제와 핵심 결과, 본인이 기여한 내용을 간단히 소개해주세요.')
      );
      let paperUrl = null;
      try {
        const url = new URL(paper.url);
        if (['https:', 'http:'].includes(url.protocol) && !url.username && !url.password) paperUrl = url.href;
      } catch { /* 논문 주소를 입력하기 전에는 링크를 비활성 상태로 표시합니다. */ }
      const link = element(paperUrl ? 'a' : 'span', 'project-link publication-link');
      if (paperUrl && /(^|\.)dbpia\.co\.kr$/.test(new URL(paperUrl).hostname)) {
        const icon = element('img', 'dbpia-icon');
        icon.alt = '';
        icon.setAttribute('aria-hidden', 'true');
        // images 디렉토리에 저장한 DBpia 공식 favicon을 표시합니다.
        icon.src = 'images/dbpia.png';
        link.append(icon);
      }
      link.append(element('span', '', paperUrl ? '논문 보기 ↗' : '논문 링크 입력 예정 ↗'));
      if (paperUrl) {
        link.href = paperUrl;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.setAttribute('aria-label', `${title} 논문 보기 (새 탭)`);
      } else link.setAttribute('aria-disabled', 'true');
      article.append(body, link);
      if (art) article.append(art);
      else article.classList.add('project-text-only');
      document.getElementById('publication-list').append(article);
    });
  </script>
</body>
</html>
