<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="김민욱 포트폴리오">
  <meta name="theme-color" content="#F5F5F5">
  <title>김민욱</title>
  <style>
    :root { --paper: #F5F5F5; --surface: #FFFFFF; --ink: #262626; --muted: #666666; --accent: #404040; --line: #DEDEDE; --soft: #F0F0F0; }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 24px; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.7; word-break: keep-all; }
    a { color: inherit; text-decoration: none; }
    button, a { -webkit-tap-highlight-color: transparent; }
    a:focus-visible { outline: 3px solid var(--accent); outline-offset: 5px; }
    ::selection { background: var(--accent); color: var(--paper); }
    .wrap { width: min(1120px, calc(100% - 96px)); margin-inline: auto; }
    .mono { font-family: ui-monospace, "SFMono-Regular", Consolas, monospace; font-size: 11px; letter-spacing: .1em; }
    .skip { position: fixed; top: -80px; left: 20px; background: var(--accent); color: var(--paper); padding: 10px 20px; z-index: 10; }
    .skip:focus { top: 12px; }
    [aria-disabled="true"] { color: var(--muted); }
    .profile-layout { display: grid; grid-template-columns: 300px minmax(0, 1fr); align-items: stretch; gap: 24px; padding: 32px 0 40px; }
    .profile-card, .about-panel { min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .profile-card { padding: 24px; }
    .profile-identity { display: flex; align-items: flex-start; gap: 16px; }
    .profile-details { min-width: 0; }
    h1 { color: var(--ink); font-size: 25px; letter-spacing: -.05em; line-height: 1.35; font-weight: 650; margin: 0 0 7px; overflow-wrap: anywhere; }
    .profile-school, .profile-major { color: var(--muted); font-size: 12px; margin: 0; }
    .school-logo { display: block; width: 148px; max-width: 100%; height: auto; margin: 6px 0; padding: 5px; border-radius: 4px; background: var(--surface); }
    .profile-contacts { display: grid; gap: 5px; margin-top: 10px; font-size: 11px; line-height: 1.5; }
    .profile-contacts p { margin: 0; }
    .contact-label { display: block; color: var(--muted); font-size: 10px; }
    .profile-contacts a { color: var(--accent); overflow-wrap: anywhere; }
    .profile-contacts a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .profile-github { display: flex; margin-top: 20px; }
    .profile-github .button { width: 100%; min-height: 38px; padding: 7px 12px; font-size: 12px; }
    .about-panel { padding: 28px; }
    .about-panel .section-head { margin-bottom: 18px; }
    .about-panel h2 { font-size: 23px; }
    .intro { color: var(--ink); font-size: 15px; font-weight: 500; white-space: pre-line; margin: 0 0 12px; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }
    .button { display: inline-flex; justify-content: center; align-items: center; gap: 22px; min-height: 46px; padding: 10px 20px; font-size: 13px; border: 1px solid var(--line); border-radius: 4px; }
    .button.primary { background: var(--accent); border-color: var(--accent); color: var(--paper); }
    a.button:hover { transform: translateY(-2px); }
    .portrait { position: relative; margin: 0; width: 80px; flex-shrink: 0; }
    .portrait-media { aspect-ratio: 1; position: relative; overflow: hidden; background: var(--paper); border-radius: 50%; border: 1px solid var(--line); }
    .portrait-media > svg { width: 100%; height: 100%; display: block; }
    .portrait-media img { position: absolute; inset: 0; height: 100%; width: 100%; object-fit: cover; object-position: center 30%; }
    .portrait-media img[hidden] { display: none; }
    .section { padding: 65px 0; border-top: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 30px; }
    .section-kicker { color: var(--muted); margin: 0 0 8px; }
    h2 { font-size: 29px; letter-spacing: -.055em; line-height: 1.4; margin: 0; font-weight: 650; }
    .section-note { color: var(--muted); font-size: 13px; margin: 0; }
    .about-copy { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.85; white-space: pre-line; }
    .interests-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
    .interests-section h3 { font-size: 15px; margin-bottom: 12px; }
    .interest-grid { display: grid; gap: 12px; }
    .interest { display: grid; grid-template-columns: 22px 1fr; gap: 2px 10px; align-items: baseline; }
    .interest-number { grid-row: span 2; color: var(--muted); font-size: 10px; }
    h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.035em; }
    .interest h4 { margin: 0; font-size: 13px; font-weight: 600; }
    .interest p { color: var(--muted); font-size: 12px; margin: 0; }
    .skills-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    .skills-section h2 { font-size: 15px; margin-bottom: 14px; }
    .stack { display: grid; gap: 15px; }
    .stack-row { display: grid; gap: 7px; }
    .stack-row h3 { color: var(--muted); font-size: 11px; font-weight: 500; }
    .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag { display: inline-block; padding: 5px 12px; border-radius: 4px; background: var(--soft); color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
    .tag.placeholder { color: var(--muted); background: transparent; border: 1px dashed var(--line); }
    .stack .tags { gap: 6px; }
    .stack .tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; font-size: 11px; }
    .skill-icon { display: inline-flex; flex-shrink: 0; width: 21px; height: 21px; padding: 2px; border-radius: 4px; background: var(--surface); }
    .skill-icon svg { width: 100%; height: 100%; }
    .projects { display: grid; gap: 20px; }
    .project { display: grid; grid-template-columns: 175px 1fr auto; gap: 30px; align-items: center; padding: 25px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); }
    .project-art { position: relative; display: grid; place-items: center; aspect-ratio: 1.3; background: var(--paper); color: var(--accent); overflow: hidden; }
    .project-art svg { width: 75px; height: 75px; }
    .project-index { position: absolute; top: 8px; left: 10px; opacity: .7; font-size: 9px; }
    .project h3 { margin-bottom: 8px; }
    .project-kind { display: inline-block; margin-bottom: 9px; padding: 2px 8px; border: 1px solid var(--line); border-radius: 3px; color: var(--muted); font-size: 10px; }
    .project p { color: var(--muted); font-size: 13px; margin: 0 0 14px; max-width: 500px; }
    .project .publication-meta { font-size: 11px; margin-bottom: 10px; }
    .project .tag { font-size: 10px; padding: 3px 9px; }
    .project-link { font-size: 12px; white-space: nowrap; align-self: start; }
    .github-link, .publication-link { display: inline-flex; align-items: center; gap: 7px; }
    .github-icon, .dbpia-icon { display: inline-flex; flex-shrink: 0; width: 16px; height: 16px; }
    .dbpia-icon { object-fit: contain; }
    .github-icon svg { display: block; width: 100%; height: 100%; }
    a.project-link:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 5px; }
    .contact { padding: 45px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 28px; margin: 10px 0 60px; border-radius: 5px; }
    .contact .mono { color: var(--muted); margin: 0 0 12px; }
    .contact h2 { font-size: 26px; }
    .contact p { margin: 9px 0 0; color: var(--muted); font-size: 13px; }
    .contact .button { background: var(--paper); border-color: var(--line); color: var(--accent); flex-shrink: 0; }
    .contact [aria-disabled] { color: var(--muted); }
    footer { border-top: 1px solid var(--line); padding: 23px 0; color: var(--muted); font-size: 11px; }
    .footer-inner { display: flex; justify-content: space-between; gap: 20px; }
    footer p { margin: 0; }
    .empty-note { color: var(--muted); font-size: 13px; }
    @media (max-width: 900px) {
      .wrap { width: calc(100% - 56px); }
      .profile-layout { grid-template-columns: 260px minmax(0, 1fr); gap: 20px; }
      .profile-card, .about-panel { padding: 20px; }
      .profile-identity { gap: 12px; }
      .portrait { width: 64px; }
      .project { grid-template-columns: 125px 1fr; gap: 22px; }
      .project-link { grid-column: 2; margin-top: -8px; }
      .project-art { grid-row: span 2; }
    }
    @media (max-width: 700px) {
      .profile-layout { grid-template-columns: 1fr; padding-top: 22px; }
      .portrait { width: 72px; }
    }
    @media (max-width: 600px) {
      .wrap { width: calc(100% - 40px); }
      h1 { font-size: 24px; }
      .section { padding: 42px 0; }
      .section-head { align-items: start; flex-direction: column; gap: 10px; margin-bottom: 24px; }
      h2 { font-size: 25px; }
      .project { grid-template-columns: 1fr; gap: 20px; padding: 20px; }
      .project-art { aspect-ratio: 2.5; grid-row: auto; }
      .project-link { grid-column: auto; margin-top: 0; }
      .contact { padding: 28px; flex-direction: column; align-items: start; margin-bottom: 36px; }
      .contact h2 { font-size: 24px; }
      .footer-inner { flex-direction: column; gap: 4px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; } a.button:hover { transform: none; } }
  </style>
</head>

  <script>
    'use strict';
    const profile = JSON.parse(document.getElementById('profile-data').textContent);
    const setText = (id, value) => { if (value) document.getElementById(id).textContent = value; };
    const element = (tag, className, text) => {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    function githubUrl(value) {
      try {
        const url = new URL(value);
        return url.protocol === 'https:' && url.hostname === 'github.com' && !url.username && !url.password ? url.href : null;
      } catch { return null; }
    }
    function githubLink(value, className, label) {
      const url = githubUrl(value);
      const node = element(url ? 'a' : 'span', `${className} github-link`);
